<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NIFTY 50 LIVE TRADER – No API Key</title>
    <script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        :root {
            --bg-primary: #0a0e27; --bg-secondary: #131837; --bg-card: #1a1f3a;
            --text-primary: #e0e0e0; --text-secondary: #a0a0b0;
            --accent-green: #00c853; --accent-red: #ff1744; --accent-blue: #2962ff;
            --accent-gold: #ffd600; --border: #2a2f4a;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            height: 100vh;
            overflow: hidden;
        }
        .trading-app {
            display: grid;
            grid-template-columns: 280px 1fr 320px;
            grid-template-rows: 60px 1fr;
            height: 100vh;
            gap: 1px;
            background: var(--border);
        }
        .top-nav {
            grid-column: 1 / -1;
            background: var(--bg-secondary);
            display: flex;
            align-items: center;
            padding: 0 20px;
            border-bottom: 2px solid var(--accent-blue);
        }
        .app-logo { font-size:20px; font-weight:700; color:var(--accent-gold); }
        .market-ticker { display:flex; gap:30px; flex:1; margin-left:20px; }
        .ticker-item { display:flex; align-items:center; gap:10px; }
        .ticker-value { font-weight:600; }
        .positive { color:var(--accent-green); }
        .negative { color:var(--accent-red); }
        .nav-actions { display:flex; gap:10px; }
        .nav-btn {
            padding:8px 16px;
            background:var(--bg-card);
            border:1px solid var(--border);
            color:var(--text-primary);
            border-radius:6px;
            cursor:pointer;
            font-size:13px;
        }
        .nav-btn.active, .nav-btn:hover { background:var(--accent-blue); border-color:var(--accent-blue); }
        .left-sidebar {
            background:var(--bg-secondary);
            overflow-y:auto;
            padding:15px;
            display:flex;
            flex-direction:column;
            gap:15px;
        }
        .section-title {
            font-size:12px;
            text-transform:uppercase;
            letter-spacing:1px;
            color:var(--text-secondary);
            margin-bottom:8px;
            border-bottom:1px solid var(--border);
            padding-bottom:4px;
        }
        .search-add {
            display:flex;
            gap:5px;
            margin-bottom:10px;
        }
        .search-add input {
            flex:1;
            padding:8px;
            background:var(--bg-primary);
            border:1px solid var(--border);
            color:var(--text-primary);
            border-radius:4px;
        }
        .search-add button {
            padding:8px 12px;
            background:var(--accent-blue);
            border:none;
            color:white;
            border-radius:4px;
            cursor:pointer;
        }
        .watchlist-item {
            display:flex;
            justify-content:space-between;
            padding:8px;
            background:var(--bg-card);
            border-radius:4px;
            margin-bottom:4px;
            cursor:pointer;
            border-left:3px solid transparent;
        }
        .watchlist-item:hover { background:var(--bg-card); border-left-color:var(--accent-blue); }
        .watchlist-item.selected { border-left-color:var(--accent-gold); }
        .main-content {
            background:var(--bg-primary);
            display:flex;
            flex-direction:column;
        }
        .chart-toolbar {
            padding:8px 15px;
            background:var(--bg-secondary);
            border-bottom:1px solid var(--border);
            display:flex;
            gap:8px;
            flex-wrap:wrap;
        }
        .timeframe-btn {
            padding:6px 12px;
            background:var(--bg-card);
            border:1px solid var(--border);
            color:var(--text-secondary);
            border-radius:4px;
            cursor:pointer;
            font-size:12px;
        }
        .timeframe-btn.active { background:var(--accent-blue); color:white; }
        .chart-container { flex:1; }
        .right-sidebar {
            background:var(--bg-secondary);
            overflow-y:auto;
            padding:15px;
        }
        .order-tabs { display:flex; margin-bottom:15px; }
        .order-tab {
            flex:1;
            padding:10px;
            text-align:center;
            cursor:pointer;
            background:var(--bg-card);
            border:none;
            color:var(--text-secondary);
            font-weight:600;
        }
        .order-tab.active.buy-tab { background:var(--accent-green); color:white; }
        .order-tab.active.sell-tab { background:var(--accent-red); color:white; }
        .order-form { background:var(--bg-card); padding:15px; border-radius:8px; }
        .form-group { margin-bottom:12px; }
        .form-label { display:block; font-size:11px; color:var(--text-secondary); margin-bottom:4px; }
        .form-input {
            width:100%;
            padding:8px;
            background:var(--bg-primary);
            border:1px solid var(--border);
            color:var(--text-primary);
            border-radius:4px;
        }
        .order-type-buttons { display:flex; gap:5px; }
        .order-type-btn {
            flex:1;
            padding:8px;
            background:var(--bg-primary);
            border:1px solid var(--border);
            color:var(--text-secondary);
            border-radius:4px;
            cursor:pointer;
            font-size:12px;
        }
        .order-type-btn.active { background:var(--accent-blue); color:white; }
        .place-order-btn {
            width:100%;
            padding:12px;
            border:none;
            border-radius:6px;
            font-weight:700;
            cursor:pointer;
            text-transform:uppercase;
        }
        .buy-order-btn { background:var(--accent-green); color:white; }
        .sell-order-btn { background:var(--accent-red); color:white; }
        .ngvs-panel {
            background: linear-gradient(135deg, #1a237e, #0d47a1);
            padding:12px;
            border-radius:8px;
            margin-bottom:15px;
            text-align:center;
        }
        .ngvs-score { font-size:28px; font-weight:700; color:var(--accent-gold); }
        .notification {
            position:fixed;
            top:80px;
            right:20px;
            background:var(--bg-card);
            border-left:4px solid var(--accent-green);
            padding:12px 20px;
            border-radius:6px;
            box-shadow:0 5px 20px rgba(0,0,0,0.5);
            z-index:1000;
            animation: slideIn 0.3s ease;
        }
        @keyframes slideIn {
            from { transform:translateX(400px); opacity:0; }
            to { transform:translateX(0); opacity:1; }
        }
        .portfolio-summary {
            background:var(--bg-card);
            padding:12px;
            border-radius:6px;
        }
        .portfolio-value { font-size:20px; font-weight:700; color:var(--accent-gold); }
        .position-item {
            background:var(--bg-card);
            padding:8px;
            border-radius:4px;
            margin-bottom:5px;
            border-left:3px solid var(--accent-green);
        }
        .position-item.loss { border-left-color:var(--accent-red); }
        .badge {
            display:inline-block;
            padding:2px 8px;
            border-radius:12px;
            font-size:11px;
            font-weight:600;
        }
        .badge-buy { background:rgba(0,200,83,0.2); color:var(--accent-green); }
        .badge-sell { background:rgba(255,23,68,0.2); color:var(--accent-red); }
        .profit-loss { font-weight:600; }
        .profit { color:var(--accent-green); }
        .loss { color:var(--accent-red); }
    </style>
</head>
<body>
<div class="trading-app">
    <nav class="top-nav">
        <div class="app-logo">📊 NIFTY 50 LIVE TRADER</div>
        <div class="market-ticker" id="marketTicker"></div>
        <div class="nav-actions">
            <button class="nav-btn active" onclick="switchView('trading')">📈 Trading</button>
            <button class="nav-btn" onclick="switchView('analysis')">🔍 Analysis</button>
            <button class="nav-btn" onclick="switchView('portfolio')">💼 Portfolio</button>
        </div>
    </nav>
    <aside class="left-sidebar">
        <div class="portfolio-summary">
            <div class="section-title">Portfolio Value</div>
            <div class="portfolio-value" id="portfolioValue">₹0.00</div>
            <div id="portfolioDayChange" style="font-size:12px;"></div>
        </div>
        <div class="search-add">
            <input type="text" id="stockSearch" placeholder="Search Nifty 50...">
            <button onclick="addSelectedStock()">+</button>
        </div>
        <div class="section-title">📋 Watchlist</div>
        <div id="watchlist"></div>
        <div class="section-title">🎯 Open Positions</div>
        <div id="openPositions">No positions</div>
    </aside>
    <main class="main-content">
        <div class="chart-toolbar">
            <button class="timeframe-btn active" onclick="changeTimeframe('1D')">1D</button>
            <button class="timeframe-btn" onclick="changeTimeframe('1W')">1W</button>
            <button class="timeframe-btn" onclick="changeTimeframe('1M')">1M</button>
            <button class="timeframe-btn" onclick="changeTimeframe('3M')">3M</button>
            <button class="timeframe-btn" onclick="changeTimeframe('1Y')">1Y</button>
            <span style="color:var(--border);">|</span>
            <button class="timeframe-btn" onclick="toggleIndicator('sma')">SMA</button>
            <button class="timeframe-btn" onclick="toggleIndicator('volume')">Volume</button>
        </div>
        <div class="chart-container" id="chartContainer"></div>
    </main>
    <aside class="right-sidebar">
        <div class="ngvs-panel">
            <div style="font-size:11px;">NGVS SCORE</div>
            <div class="ngvs-score" id="currentNgvs">--</div>
            <div id="currentSignal" style="font-size:12px;">Select a stock</div>
        </div>
        <div class="order-tabs">
            <button class="order-tab buy-tab active" onclick="switchOrderTab('buy')">BUY</button>
            <button class="order-tab sell-tab" onclick="switchOrderTab('sell')">SELL</button>
        </div>
        <div class="order-form">
            <div class="form-group">
                <label class="form-label">Stock</label>
                <input type="text" class="form-input" id="orderStock" readonly>
            </div>
            <div class="form-group">
                <label class="form-label">Order Type</label>
                <div class="order-type-buttons">
                    <button class="order-type-btn active" onclick="setOrderType('market')">Market</button>
                    <button class="order-type-btn" onclick="setOrderType('limit')">Limit</button>
                </div>
            </div>
            <div class="form-group" id="limitPriceGroup" style="display:none;">
                <label class="form-label">Limit Price</label>
                <input type="number" class="form-input" id="limitPrice" value="0">
            </div>
            <div class="form-group">
                <label class="form-label">Quantity</label>
                <input type="number" class="form-input" id="orderQty" value="1" min="1">
            </div>
            <div class="form-group">
                <label class="form-label">Total Value</label>
                <div id="totalValue" style="font-size:16px; font-weight:600;">₹0.00</div>
            </div>
            <button class="place-order-btn buy-order-btn" id="placeOrderBtn" onclick="placeOrder()">PLACE BUY ORDER</button>
        </div>
        <div style="margin-top:15px;">
            <div class="section-title">📜 Recent Orders</div>
            <div id="recentOrders">No orders yet</div>
        </div>
    </aside>
</div>
<script>
// ==================== DATA: No API Key Required ====================
const NIFTY50_SYMBOLS = [
    "RELIANCE.NS", "TCS.NS", "HDFCBANK.NS", "INFY.NS", "ICICIBANK.NS",
    "HINDUNILVR.NS", "KOTAKBANK.NS", "ITC.NS", "SBIN.NS", "BHARTIARTL.NS",
    "BAJFINANCE.NS", "ASIANPAINT.NS", "MARUTI.NS", "AXISBANK.NS", "LT.NS",
    "DMART.NS", "SUNPHARMA.NS", "WIPRO.NS", "TITAN.NS", "ULTRACEMCO.NS",
    "NESTLEIND.NS", "POWERGRID.NS", "NTPC.NS", "M&M.NS", "TECHM.NS",
    "HCLTECH.NS", "JSWSTEEL.NS", "TATASTEEL.NS", "ONGC.NS", "COALINDIA.NS",
    "GRASIM.NS", "DIVISLAB.NS", "BPCL.NS", "BRITANNIA.NS", "EICHERMOT.NS",
    "CIPLA.NS", "DRREDDY.NS", "HEROMOTOCO.NS", "BAJAJ-AUTO.NS", "SHREECEM.NS",
    "INDUSINDBK.NS", "SBILIFE.NS", "HDFCLIFE.NS", "UPL.NS", "HINDALCO.NS",
    "TATAMOTORS.NS", "APOLLOHOSP.NS", "ADANIPORTS.NS", "BAJAJFINSV.NS",
    "SHRIRAMFIN.NS"
];

const NGVS_SCORES = {
    "HDFCBANK.NS":91.2, "TCS.NS":89.7, "INFY.NS":87.5, "RELIANCE.NS":86.8,
    "ICICIBANK.NS":81.5, "SBIN.NS":78.2, "ITC.NS":83.8, "BHARTIARTL.NS":82.3,
    "KOTAKBANK.NS":84.2, "BAJFINANCE.NS":84.9, "ASIANPAINT.NS":85.4,
    "MARUTI.NS":78.5, "AXISBANK.NS":70.2, "LT.NS":81.8, "DMART.NS":83.1,
    "SUNPHARMA.NS":80.2, "WIPRO.NS":74.8, "TITAN.NS":82.7, "ULTRACEMCO.NS":79.2,
    "NESTLEIND.NS":79.8, "POWERGRID.NS":73.2, "NTPC.NS":72.8, "M&M.NS":66.2,
    "TECHM.NS":76.2, "HCLTECH.NS":80.9, "JSWSTEEL.NS":71.2, "TATASTEEL.NS":70.5,
    "ONGC.NS":66.8, "COALINDIA.NS":73.8, "GRASIM.NS":71.8, "DIVISLAB.NS":78.8,
    "BPCL.NS":68.2, "BRITANNIA.NS":76.8, "EICHERMOT.NS":75.8, "CIPLA.NS":75.2,
    "DRREDDY.NS":77.8, "HEROMOTOCO.NS":68.8, "BAJAJ-AUTO.NS":65.2,
    "SHREECEM.NS":64.8, "INDUSINDBK.NS":69.8, "SBILIFE.NS":64.2,
    "HDFCLIFE.NS":77.5, "UPL.NS":65.8, "HINDALCO.NS":67.8, "TATAMOTORS.NS":67.2,
    "APOLLOHOSP.NS":69.2, "ADANIPORTS.NS":72.2, "BAJAJFINSV.NS":77.2,
    "SHRIRAMFIN.NS":63.8
};

// Fallback pricing data for initial load
const FALLBACK_PRICES = {
    "RELIANCE.NS": { price: 2850.50, change: 1.25, name: "RELIANCE", ngvs: 86.8 },
    "TCS.NS": { price: 3450.00, change: -0.50, name: "TCS", ngvs: 89.7 },
    "HDFCBANK.NS": { price: 1650.75, change: 2.10, name: "HDFCBANK", ngvs: 91.2 },
    "INFY.NS": { price: 1890.20, change: 0.85, name: "INFY", ngvs: 87.5 },
    "ICICIBANK.NS": { price: 1045.50, change: 1.50, name: "ICICIBANK", ngvs: 81.5 },
    "HINDUNILVR.NS": { price: 2340.25, change: -1.20, name: "HINDUNILVR", ngvs: 80.2 },
    "KOTAKBANK.NS": { price: 1890.00, change: 0.95, name: "KOTAKBANK", ngvs: 84.2 },
    "ITC.NS": { price: 385.40, change: 1.10, name: "ITC", ngvs: 83.8 },
    "SBIN.NS": { price: 650.75, change: 2.35, name: "SBIN", ngvs: 78.2 },
    "BHARTIARTL.NS": { price: 1310.20, change: 0.75, name: "BHARTIARTL", ngvs: 82.3 }
};

const stockData = {};
let watchlist = NIFTY50_SYMBOLS.slice(0, 10);
let selectedSymbol = 'HDFCBANK.NS';
let orderSide = 'buy';
let orderType = 'market';
let positions = [];
let orders = [];
let chart, candleSeries, volumeSeries, smaSeries;

// ==================== STOCK DATA FETCHER ====================
async function fetchStockPrice(symbol) {
    try {
        const proxyUrl = `https://api.allorigins.win/raw?url=`;
        const yahooUrl = `https://query1.finance.yahoo.com/v8/finance/chart/${symbol}?interval=1d&range=1y`;
        const fullUrl = proxyUrl + encodeURIComponent(yahooUrl);
        
        const response = await fetch(fullUrl, { timeout: 5000 });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        
        const data = await response.json();
        if (!data.chart || !data.chart.result || !data.chart.result[0]) return null;
        
        const result = data.chart.result[0];
        const quotes = result.quote;
        const latestQuote = quotes[quotes.length - 1];
        
        if (!latestQuote || latestQuote.close === null) return null;
        
        const currentPrice = latestQuote.close;
        const previousClose = result.meta.previousClose;
        const change = previousClose ? ((currentPrice - previousClose) / previousClose) * 100 : 0;
        
        return {
            price: currentPrice,
            change: change,
            name: symbol.replace('.NS', ''),
            ngvs: NGVS_SCORES[symbol] || 75
        };
    } catch (error) {
        console.warn(`Fetch failed for ${symbol}, using fallback`);
        return null;
    }
}

async function fetchAllPrices() {
    console.log('Fetching stock prices...');
    
    const promises = watchlist.map(async (symbol) => {
        const data = await fetchStockPrice(symbol);
        if (data) {
            stockData[symbol] = data;
        } else if (!stockData[symbol]) {
            // Use fallback data
            stockData[symbol] = FALLBACK_PRICES[symbol] || {
                price: 1000 + Math.random() * 2000,
                change: (Math.random() - 0.5) * 5,
                name: symbol.replace('.NS', ''),
                ngvs: NGVS_SCORES[symbol] || 75
            };
        }
    });
    
    await Promise.all(promises);
    
    renderWatchlist();
    updatePortfolioSummary();
    updateMarketTicker();
}

// ==================== UI Updates ====================
function renderWatchlist() {
    const container = document.getElementById('watchlist');
    let html = '';
    for (let sym of watchlist) {
        const s = stockData[sym];
        if (!s) continue;
        const price = s.price?.toFixed(2) || '0.00';
        const change = s.change?.toFixed(2) || '0.00';
        const cls = change >= 0 ? 'positive' : 'negative';
        html += `
        <div class="watchlist-item ${sym === selectedSymbol ? 'selected' : ''}" onclick="selectStock('${sym}')">
            <div>
                <div style="font-weight:600;">${s.name}</div>
                <div style="font-size:11px; color:var(--text-secondary);">NGVS: ${s.ngvs}</div>
            </div>
            <div style="text-align:right;">
                <div>₹${price}</div>
                <div class="${cls}">${change >= 0 ? '+' : ''}${change}%</div>
            </div>
        </div>`;
    }
    container.innerHTML = html || '<div style="color:var(--text-secondary);">Watchlist empty</div>';
}

function selectStock(sym) {
    selectedSymbol = sym;
    document.getElementById('orderStock').value = sym;
    const s = stockData[sym];
    if (s) {
        document.getElementById('currentNgvs').innerText = s.ngvs;
        document.getElementById('currentSignal').innerText = s.ngvs >= 85 ? 'STRONG BUY' : 'WATCH';
    }
    updateOrderSummary();
    updateChartForSymbol();
    renderWatchlist();
}

function addSelectedStock() {
    const query = document.getElementById('stockSearch').value.toUpperCase();
    const match = NIFTY50_SYMBOLS.find(sym => sym.includes(query) && !watchlist.includes(sym));
    if (match) {
        watchlist.push(match);
        fetchAllPrices();
        document.getElementById('stockSearch').value = '';
    } else {
        alert('Not found or already added.');
    }
}

// ==================== CHART (Simulated) ====================
function initChart() {
    const container = document.getElementById('chartContainer');
    chart = LightweightCharts.createChart(container, {
        layout: { background: { color: '#0a0e27' }, textColor: '#a0a0b0' },
        grid: { vertLines: { color: '#1a1f3a' }, horzLines: { color: '#1a1f3a' } },
        crosshair: { mode: 1 },
        rightPriceScale: { borderColor: '#2a2f4a' },
        timeScale: { borderColor: '#2a2f4a' },
    });
    candleSeries = chart.addCandlestickSeries({
        upColor: '#00c853', downColor: '#ff1744',
        borderUpColor: '#00c853', borderDownColor: '#ff1744',
        wickUpColor: '#00c853', wickDownColor: '#ff1744',
    });
    volumeSeries = chart.addHistogramSeries({
        priceFormat: { type: 'volume' },
        priceScaleId: '',
    });
    volumeSeries.priceScale().applyOptions({ scaleMargins: { top: 0.8, bottom: 0 } });
    window.addEventListener('resize', () => chart.applyOptions({ 
        width: container.clientWidth, height: container.clientHeight 
    }));
}

function generateMockChart(sym) {
    const base = stockData[sym]?.price || 1500;
    const data = [], vol = [];
    let time = Math.floor(Date.now() / 1000) - 100*86400;
    let price = base * 0.9;
    for (let i = 0; i < 500; i++) {
        const open = price + (Math.random() - 0.5) * 20;
        const close = open + (Math.random() - 0.5) * 30;
        const high = Math.max(open, close) + Math.random() * 10;
        const low = Math.min(open, close) - Math.random() * 10;
        data.push({ time, open, high, low, close });
        vol.push({ time, value: Math.floor(Math.random() * 500000 + 200000), 
                   color: close >= open ? 'rgba(0,200,83,0.5)' : 'rgba(255,23,68,0.5)' });
        price = close;
        time += 86400;
    }
    candleSeries.setData(data);
    volumeSeries.setData(vol);
}

function updateChartForSymbol() { generateMockChart(selectedSymbol); }
function changeTimeframe(tf) {
    document.querySelectorAll('.timeframe-btn').forEach(b => b.classList.remove('active'));
    event.target.classList.add('active');
    generateMockChart(selectedSymbol);
}
function toggleIndicator(ind) {
    if (ind === 'sma') {
        if (smaSeries) { chart.removeSeries(smaSeries); smaSeries = null; event.target.classList.remove('active'); }
        else {
            smaSeries = chart.addLineSeries({ color: '#2962ff', lineWidth: 2 });
            const data = candleSeries.data().map((p, i, arr) => {
                if (i < 19) return { time: p.time };
                let sum = 0;
                for (let j = i-19; j <= i; j++) sum += arr[j].close;
                return { time: p.time, value: sum/20 };
            }).filter(p => p.value);
            smaSeries.setData(data);
            event.target.classList.add('active');
        }
    } else if (ind === 'volume') {
        volumeSeries.applyOptions({ visible: !volumeSeries.options().visible });
        event.target.classList.toggle('active');
    }
}

// ==================== ORDER SYSTEM ====================
function switchOrderTab(side) {
    orderSide = side;
    document.querySelectorAll('.order-tab').forEach(t => t.classList.remove('active'));
    document.querySelector(`.${side}-tab`).classList.add('active');
    const btn = document.getElementById('placeOrderBtn');
    btn.textContent = `PLACE ${side.toUpperCase()} ORDER`;
    btn.className = `place-order-btn ${side}-order-btn`;
}
function setOrderType(type) {
    orderType = type;
    document.querySelectorAll('.order-type-btn').forEach(b => b.classList.remove('active'));
    event.target.classList.add('active');
    document.getElementById('limitPriceGroup').style.display = type === 'limit' ? 'block' : 'none';
    updateOrderSummary();
}
function updateOrderSummary() {
    const price = stockData[selectedSymbol]?.price || 0;
    const qty = parseInt(document.getElementById('orderQty').value) || 1;
    document.getElementById('totalValue').innerText = `₹${(price * qty).toFixed(2)}`;
}
function placeOrder() {
    const sym = selectedSymbol;
    const price = stockData[sym]?.price || 0;
    const qty = parseInt(document.getElementById('orderQty').value);
    if (!qty) return;
    const order = {
        id: Date.now(),
        symbol: sym,
        name: stockData[sym]?.name,
        side: orderSide,
        type: orderType,
        qty,
        price,
        total: price * qty,
        time: new Date().toLocaleTimeString()
    };
    orders.unshift(order);
    if (orderSide === 'buy') {
        positions.push({ ...order, buyPrice: price, currentPrice: price, pnl: 0, pnlPercent: 0 });
    } else {
        let remaining = qty;
        positions = positions.filter(p => {
            if (p.symbol === sym && remaining > 0) {
                const closeQty = Math.min(p.qty, remaining);
                p.qty -= closeQty;
                remaining -= closeQty;
                return p.qty > 0;
            }
            return true;
        });
    }
    renderRecentOrders();
    renderOpenPositions();
    updatePortfolioSummary();
    showNotification(`✅ ${orderSide.toUpperCase()} ${qty} ${sym} @ ₹${price}`);
}
function renderRecentOrders() {
    const container = document.getElementById('recentOrders');
    if (!orders.length) { container.innerHTML = 'No orders yet'; return; }
    container.innerHTML = orders.slice(0,5).map(o => `
        <div class="position-item ${o.side === 'sell' ? 'loss' : ''}">
            <div><strong>${o.symbol}</strong> <span class="badge badge-${o.side}">${o.side.toUpperCase()}</span></div>
            <div>${o.qty} @ ₹${o.price} | ${o.time}</div>
        </div>
    `).join('');
}
function renderOpenPositions() {
    const container = document.getElementById('openPositions');
    if (!positions.length) { container.innerHTML = 'No positions'; return; }
    container.innerHTML = positions.map(p => {
        const currentPrice = stockData[p.symbol]?.price || p.buyPrice;
        const pnl = (currentPrice - p.buyPrice) * p.qty;
        const pnlPercent = ((currentPrice - p.buyPrice) / p.buyPrice * 100).toFixed(2);
        const cls = pnl >= 0 ? 'profit' : 'loss';
        return `
        <div class="position-item ${pnl < 0 ? 'loss' : ''}">
            <div style="display:flex; justify-content:space-between;">
                <strong>${p.symbol}</strong>
                <span class="profit-loss ${cls}">${pnl >= 0 ? '+' : ''}₹${Math.abs(pnl).toFixed(2)} (${pnlPercent}%)</span>
            </div>
            <div style="font-size:11px;">Qty: ${p.qty} | Buy: ₹${p.buyPrice} | LTP: ₹${currentPrice.toFixed(2)}</div>
        </div>`;
    }).join('');
}
function updatePortfolioSummary() {
    let totalValue = 0, totalCost = 0;
    positions.forEach(p => {
        const currentPrice = stockData[p.symbol]?.price || p.buyPrice;
        totalValue += currentPrice * p.qty;
        totalCost += p.buyPrice * p.qty;
    });
    const dayChange = totalValue - totalCost;
    document.getElementById('portfolioValue').innerText = `₹${totalValue.toFixed(2)}`;
    const changeEl = document.getElementById('portfolioDayChange');
    changeEl.innerText = `${dayChange >= 0 ? '+' : ''}��${dayChange.toFixed(2)} (${totalCost ? (dayChange/totalCost*100).toFixed(2) : 0}%)`;
    changeEl.className = dayChange >= 0 ? 'positive' : 'negative';
}
function updateMarketTicker() {
    document.getElementById('marketTicker').innerHTML = '';
}
function showNotification(msg) {
    const div = document.createElement('div');
    div.className = 'notification';
    div.textContent = msg;
    document.body.appendChild(div);
    setTimeout(() => div.remove(), 3000);
}
function switchView(view) {
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
    event.target.classList.add('active');
    if (view === 'analysis') {
        const s = stockData[selectedSymbol];
        alert(`📊 ${s.name}\nNGVS: ${s.ngvs}\nPrice: ₹${s.price?.toFixed(2)}\nChange: ${s.change?.toFixed(2)}%`);
    } else if (view === 'portfolio') {
        let total = 0;
        positions.forEach(p => total += (stockData[p.symbol]?.price || p.buyPrice) * p.qty);
        alert(`💼 Portfolio Value: ₹${total.toFixed(2)}\nPositions: ${positions.length}\nOrders: ${orders.length}`);
    }
}

document.addEventListener('keydown', e => {
    if (e.key === 'Enter' && document.activeElement.id === 'stockSearch') addSelectedStock();
});

// ==================== INITIALIZE ====
window.onload = async () => {
    initChart();
    await fetchAllPrices();
    setInterval(fetchAllPrices, 60000);
    selectStock(selectedSymbol);
};
</script>
